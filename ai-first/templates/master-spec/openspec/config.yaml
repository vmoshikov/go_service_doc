schema: mk8s

context: |
  Платформа Managed Kubernetes. Компоненты описаны в wiki/code/components.toml репозитория ai-first.
  Роли: аналитик пишет intent.md; разработчик пишет specs/, design.md, tasks.md. Чужие файлы не меняй.
  Все артефакты пиши упрощённым техническим русским языком.
  Не переноси в артефакты персональные данные, адреса клиентов и секреты.

rules:
  specs:
    - Каждый критерий приёмки из intent.md покрой хотя бы одним сценарием
  tasks:
    - Группа задач — один компонент из intent.md, заголовок «## N. <компонент>»

operations:
  apply:
    guidance:
      - Код меняй только в репозитории компонента своей группы задач
      - Отмечай задачу [x] только после проверки из её описания
