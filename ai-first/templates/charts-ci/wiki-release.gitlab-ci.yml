# Подключи в .gitlab-ci.yml репозитория чартов. Тег репозитория чартов — версия платформы.
# Переменные CI/CD: WIKI_TRIGGER_TOKEN, WIKI_PROJECT_ID.

wiki-release:
  stage: .post
  image: curlimages/curl:8.10.1
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - >
      curl -sf -X POST
      -F token="$WIKI_TRIGGER_TOKEN" -F ref=main
      -F "variables[DOCS_EVENT]=release"
      -F "variables[CHARTS_TAG]=$CI_COMMIT_TAG"
      "$CI_API_V4_URL/projects/$WIKI_PROJECT_ID/trigger/pipeline"
