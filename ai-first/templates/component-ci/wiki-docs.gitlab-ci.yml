# Подключи в .gitlab-ci.yml репозитория компонента:
#   include:
#     - project: mk8s/ai-first
#       file: templates/component-ci/wiki-docs.gitlab-ci.yml
# Переменные CI/CD группы: WIKI_TRIGGER_TOKEN (trigger token проекта ai-first), WIKI_PROJECT_ID.
# На каждый тег CI ai-first создаёт wiki/code/<компонент>/ для этого тега.

wiki-docs:
  stage: .post
  image: curlimages/curl:8.10.1
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - >
      curl -sf -X POST
      -F token="$WIKI_TRIGGER_TOKEN" -F ref=main
      -F "variables[DOCS_EVENT]=component-tag"
      -F "variables[COMPONENT_REPO]=$CI_PROJECT_URL"
      -F "variables[TAG]=$CI_COMMIT_TAG"
      "$CI_API_V4_URL/projects/$WIKI_PROJECT_ID/trigger/pipeline"
